<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>プロフィールメーカー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Noto+Serif+JP:wght@400;700;900&family=Zen+Maru+Gothic:wght@400;700;900&display=swap">
<style>
/* レイアウト: 左に入力フォーム、右にライブプレビュー（スマホはタブ切替） */
:root {
  --bg: #f3f4f7;
  --panel: #ffffff;
  --fg: #1d2230;
  --muted: #646b7d;
  --line: #dde0e8;
  --field: #f8f9fb;
  --accent: #2f55d4;
  --accent-fg: #ffffff;
  --danger: #c23b3b;
  --ok: #1f8a5a;
  --font-ui: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161c; --panel: #1d2029; --fg: #e8eaf0; --muted: #9aa1b2; --line: #2e3240;
    --field: #252935; --accent: #7d9bff; --accent-fg: #0e1430; --danger: #ff7a7a; --ok: #5fd39a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14161c; --panel: #1d2029; --fg: #e8eaf0; --muted: #9aa1b2; --line: #2e3240;
  --field: #252935; --accent: #7d9bff; --accent-fg: #0e1430; --danger: #ff7a7a; --ok: #5fd39a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
header.top { max-width: 1240px; margin: 0 auto 16px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
header.top h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
header.top p { margin: 0; color: var(--muted); font-size: 13px; }

.app { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 20px; align-items: start; }
.pane { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; min-width: 0; }
.preview-pane { position: sticky; top: max(16px, env(safe-area-inset-top, 0px)); display: grid; gap: 14px; }

.group { display: grid; gap: 12px; padding-bottom: 18px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
.group:last-child { border-bottom: 0; margin-bottom: 0; padding-bottom: 0; }
.group h2 { font-size: 12px; margin: 0; color: var(--muted); letter-spacing: .12em; font-weight: 700; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
label.f { display: grid; gap: 4px; font-size: 13px; font-weight: 700; min-width: 0; }
label.f small { font-weight: 400; color: var(--muted); }
input[type="text"], textarea, select {
  width: 100%; font: inherit; font-weight: 400; color: var(--fg); background: var(--field);
  border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px;
}
textarea { resize: vertical; min-height: 84px; }
input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible, .seg label:focus-within {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.count { float: right; font-size: 11px; color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }

.drop {
  display: flex; align-items: center; gap: 14px; padding: 14px; border: 1.5px dashed var(--line);
  border-radius: 10px; background: var(--field); cursor: pointer;
}
.drop.over { border-color: var(--accent); }
.drop .thumb { width: 64px; height: 64px; border-radius: 50%; background: var(--line) center/cover no-repeat; flex: none; }
.drop .txt { min-width: 0; font-size: 13px; }
.drop .txt b { display: block; }
.drop .txt span { color: var(--muted); font-size: 12px; }
#photo { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.range { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
.range input { width: 100%; accent-color: var(--accent); }

.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label {
  padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer;
  font-size: 13px; background: var(--field); user-select: none;
}
.seg input:checked + span { color: var(--accent); font-weight: 700; }
.seg label:has(input:checked) { border-color: var(--accent); }

.swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.swatches button {
  width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--panel);
  box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0;
}
.swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--fg); }
.swatches input[type="color"] { width: 36px; height: 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); padding: 2px; cursor: pointer; }

.stage { display: grid; place-items: center; background: repeating-conic-gradient(var(--field) 0 25%, var(--bg) 0 50%) 0 0 / 20px 20px; border-radius: 10px; padding: 14px; min-height: 240px; }
#card { display: block; max-width: 100%; max-height: calc(100vh - 260px); width: auto; height: auto; border-radius: 4px; box-shadow: 0 6px 24px rgba(0,0,0,.18); touch-action: none; cursor: grab; }
#card.dragging { cursor: grabbing; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button.btn {
  font: inherit; font-weight: 700; border-radius: 10px; padding: 11px 18px; cursor: pointer;
  border: 1px solid var(--line); background: var(--field); color: var(--fg);
}
button.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); flex: 1 1 220px; font-size: 15px; }
button.btn:disabled { opacity: .5; cursor: not-allowed; }
button.btn.danger { color: var(--danger); }
.msg { font-size: 13px; min-height: 1.6em; margin: 0; }
.msg.err { color: var(--danger); }
.msg.ok { color: var(--ok); }

.tabs { display: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (max-width: 860px) {
  body { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  .app { grid-template-columns: minmax(0, 1fr); }
  .preview-pane { position: static; }
  #card { max-height: calc(100vh - 300px); }
  body[data-tab="edit"] .preview-pane { display: none; }
  body[data-tab="preview"] .form-pane { display: none; }
  .tabs {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    background: var(--panel); border-top: 1px solid var(--line);
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  .tabs button { font: inherit; font-weight: 700; padding: 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--field); color: var(--fg); cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
}
@media (max-width: 420px) { .row2 { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: no-preference) { button, .seg label { transition: background-color .15s, border-color .15s; } }
</style>
</head>
<body data-tab="edit">

<header class="top">
  <h1>プロフィールメーカー</h1>
  <p>入力内容と写真はこの画面の中だけで使い、どこにも保存・送信しません。</p>
</header>

<main class="app">
  <form class="pane form-pane" id="form" autocomplete="off">
    <section class="group">
      <h2>写真</h2>
      <label class="drop" id="drop" for="photo">
        <span class="thumb" id="thumb"></span>
        <span class="txt"><b id="photoLabel">写真を選ぶ</b><span>タップして選択、またはここにドラッグ＆ドロップ</span></span>
      </label>
      <input type="file" id="photo" accept="image/*">
      <div class="range">
        <span>拡大</span>
        <input type="range" id="zoom" min="1" max="3" step="0.01" value="1" aria-label="写真の拡大率">
        <button type="button" class="btn" id="resetPhoto" style="padding:6px 12px">位置リセット</button>
      </div>
      <p class="hint">拡大したあと、プレビュー上の写真をドラッグすると位置を調整できます。</p>
    </section>

    <section class="group">
      <h2>基本情報</h2>
      <div class="row2">
        <label class="f"><span>名前 <small>（必須）</small></span><input type="text" id="name" maxlength="30" value="山田 花子"></label>
        <label class="f">ふりがな・ローマ字<input type="text" id="kana" maxlength="40" value="HANAKO YAMADA"></label>
      </div>
      <label class="f">肩書き・所属<input type="text" id="title" maxlength="60" value="Webデザイナー ／ 株式会社サンプル"></label>
      <label class="f">キャッチコピー<input type="text" id="catch" maxlength="60" value="「伝わる」をデザインで形にします"></label>
    </section>

    <section class="group">
      <h2>自己紹介</h2>
      <label class="f"><span>自己紹介文 <span class="count" id="bioCount"></span></span>
        <textarea id="bio" rows="5" maxlength="300">東京都出身。制作会社で8年間、企業サイトやLPのデザインを担当してきました。休日はカメラを持って街歩きをしています。気軽に声をかけてください！</textarea>
      </label>
      <label class="f"><span>好きなこと・特技 <small>「、」で区切るとタグになります</small></span>
        <input type="text" id="tags" maxlength="120" value="カメラ、カフェ巡り、キャンプ、Figma">
      </label>
      <label class="f"><span>連絡先・SNS <small>1行に1つ</small></span>
        <textarea id="contacts" rows="3" maxlength="200">Instagram @hanako_design
X @hanako_yamada</textarea>
      </label>
    </section>

    <section class="group">
      <h2>デザイン</h2>
      <div class="seg" role="radiogroup" aria-label="テンプレート">
        <label><input type="radio" name="tpl" value="basic" checked><span>ベーシック</span></label>
        <label><input type="radio" name="tpl" value="photo"><span>フォト</span></label>
        <label><input type="radio" name="tpl" value="dark"><span>ダーク</span></label>
      </div>
      <div class="seg" role="radiogroup" aria-label="画像サイズ">
        <label><input type="radio" name="size" value="portrait" checked><span>縦 4:5</span></label>
        <label><input type="radio" name="size" value="square"><span>正方形</span></label>
        <label><input type="radio" name="size" value="story"><span>ストーリー 9:16</span></label>
        <label><input type="radio" name="size" value="landscape"><span>横 16:9</span></label>
      </div>
      <div class="seg" role="radiogroup" aria-label="フォント">
        <label><input type="radio" name="font" value="sans" checked><span>ゴシック</span></label>
        <label><input type="radio" name="font" value="serif"><span>明朝</span></label>
        <label><input type="radio" name="font" value="maru"><span>丸ゴシック</span></label>
      </div>
      <div class="swatches" id="swatches" aria-label="テーマカラー">
        <input type="color" id="color" value="#2f6fed" aria-label="好きな色を選ぶ">
      </div>
    </section>

    <section class="group">
      <div class="actions">
        <button type="button" class="btn danger" id="clearAll">入力をすべてクリア</button>
        <button type="button" class="btn" id="clearYes" hidden>本当にクリアする</button>
        <button type="button" class="btn" id="clearNo" hidden>やめる</button>
      </div>
    </section>
  </form>

  <section class="pane preview-pane" aria-label="プレビュー">
    <div class="stage"><canvas id="card" width="1080" height="1350" aria-label="プロフィール画像のプレビュー"></canvas></div>
    <p class="hint">入力を変えるとすぐ反映されます。内容がよければ下のボタンで保存、違っていれば左の入力欄を直してください。</p>
    <div class="actions">
      <button type="button" class="btn primary" id="download">この内容で画像をダウンロード（PNG）</button>
    </div>
    <p class="msg" id="msg" role="status"></p>
  </section>
</main>

<nav class="tabs" role="tablist" aria-label="表示切替">
  <button type="button" role="tab" id="tabEdit" aria-selected="true">入力する</button>
  <button type="button" role="tab" id="tabPreview" aria-selected="false">プレビュー・保存</button>
</nav>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const canvas = $('#card');
  const ctx = canvas.getContext('2d');

  const SIZES = { portrait: [1080, 1350], square: [1080, 1080], story: [1080, 1920], landscape: [1600, 900] };
  const FONTS = {
    sans: '"Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif',
    serif: '"Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif',
    maru: '"Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif',
  };
  const PRESETS = ['#2f6fed', '#e2546b', '#f08a24', '#2a9d6f', '#7b5cd6', '#3a4256'];

  const state = { img: null, imgUrl: null, zoom: 1, fx: 0, fy: 0, color: PRESETS[0] };
  let photoGeom = null; // 直近描画時の写真枠（ドラッグ計算用）

  // ---------- 色ユーティリティ ----------
  const hexToRgb = (h) => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  const mix = (a, b, t) => { const x = hexToRgb(a), y = hexToRgb(b); return 'rgb(' + x.map((v, i) => Math.round(v + (y[i] - v) * t)).join(',') + ')'; };
  const rgba = (h, a) => 'rgba(' + hexToRgb(h).join(',') + ',' + a + ')';
  const luminance = (h) => { const [r, g, b] = hexToRgb(h).map((v) => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }); return .2126 * r + .7152 * g + .0722 * b; };

  // ---------- 入力の取得 ----------
  const val = (id) => $('#' + id).value.trim();
  const radio = (name) => document.querySelector('input[name="' + name + '"]:checked').value;
  function data() {
    return {
      name: val('name'), kana: val('kana'), title: val('title'), catch: val('catch'), bio: $('#bio').value.trim(),
      tags: val('tags').split(/[、,，\n]+/).map((s) => s.trim()).filter(Boolean),
      contacts: $('#contacts').value.split('\n').map((s) => s.trim()).filter(Boolean),
      tpl: radio('tpl'), size: radio('size'), font: radio('font'),
    };
  }

  // ---------- テキスト折り返し（日本語は1文字単位、英数字は単語単位、簡易禁則つき） ----------
  const NO_START = /^[、。，．,.・：:；;！!？?」』）)\]】〉》ーぁぃぅぇぉっゃゅょァィゥェォッャュョ〜]/;
  function wrap(text, maxW) {
    const out = [];
    for (const para of text.split('\n')) {
      const tokens = para.match(/[\x21-\x7E]+\s*|\s+|./gsu) || [''];
      let line = '';
      const fits = (s) => ctx.measureText(s.trimEnd()).width <= maxW;
      for (const t of tokens) {
        if (fits(line + t)) { line += t; continue; }
        if (line && NO_START.test(t)) { line += t; continue; }
        if (line.trim()) out.push(line.trimEnd());
        line = '';
        const tt = t.trimStart();
        if (fits(tt)) { line = tt; continue; }
        for (const ch of tt) { // 長すぎる単語は文字単位で分割
          if (line && !fits(line + ch)) { out.push(line); line = ''; }
          line += ch;
        }
      }
      out.push(line.trimEnd());
    }
    return out;
  }

  function rrect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function shapePath(b) {
    if (b.shape === 'circle') { ctx.beginPath(); ctx.arc(b.x + b.w / 2, b.y + b.h / 2, b.w / 2, 0, Math.PI * 2); }
    else rrect(b.x, b.y, b.w, b.h, b.r || 0);
  }

  // ---------- 写真 ----------
  function drawPhoto(b, col) {
    ctx.save();
    shapePath(b); ctx.clip();
    if (state.img) {
      const img = state.img;
      const sc = Math.max(b.w / img.naturalWidth, b.h / img.naturalHeight) * state.zoom;
      const dw = img.naturalWidth * sc, dh = img.naturalHeight * sc;
      const mx = (dw - b.w) / 2, my = (dh - b.h) / 2;
      ctx.drawImage(img, b.x - mx + state.fx * mx, b.y - my + state.fy * my, dw, dh);
      photoGeom = { mx, my };
    } else {
      ctx.fillStyle = col.placeholder; ctx.fillRect(b.x, b.y, b.w, b.h);
      const cx = b.x + b.w / 2, s = Math.min(b.w, b.h);
      ctx.fillStyle = col.placeholderIcon;
      ctx.beginPath(); ctx.arc(cx, b.y + b.h / 2 - s * .08, s * .18, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx, b.y + b.h / 2 + s * .42, s * .34, s * .3, 0, 0, Math.PI * 2); ctx.fill();
      photoGeom = null;
    }
    ctx.restore();
    if (b.ring) { ctx.save(); shapePath(b); ctx.lineWidth = b.ring.w; ctx.strokeStyle = b.ring.c; ctx.stroke(); ctx.restore(); }
  }

  // ---------- テキストブロック（draw=false で高さだけ測る） ----------
  function textBlock(d, box, col, fam, s, draw) {
    const u = box.u * s;
    const center = box.align === 'center';
    const ax = center ? box.x + box.w / 2 : box.x;
    let y = box.y, first = true;
    const gap = (g) => { if (!first) y += g * u; first = false; };
    const font = (w, px) => w + ' ' + px + 'px ' + fam;
    ctx.textAlign = center ? 'center' : 'left';
    ctx.textBaseline = 'middle';
    const para = (text, size, weight, color, lh, spacing) => {
      const px = size * u;
      ctx.font = font(weight, px);
      if ('letterSpacing' in ctx) ctx.letterSpacing = spacing ? (px * spacing) + 'px' : '0px';
      for (const ln of wrap(text, box.w)) {
        if (draw) { ctx.fillStyle = color; ctx.fillText(ln, ax, y + px * lh / 2); }
        y += px * lh;
      }
      if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
    };

    if (d.name) { gap(0); para(d.name, .078, 900, col.name, 1.25, .02); }
    if (d.kana) { gap(.004); para(d.kana, .025, 700, col.muted, 1.4, .18); }
    if (d.title) { gap(.018); para(d.title, .032, 700, col.accent, 1.45); }
    if (d.catch) { gap(.034); para(d.catch, .04, 700, col.name, 1.45); }
    if (d.bio || d.tags.length || d.contacts.length) {
      if (!first) {
        gap(.036);
        const lw = .09 * u, lh = Math.max(3, .006 * u);
        if (draw) { ctx.fillStyle = col.accent; ctx.fillRect(center ? ax - lw / 2 : ax, y, lw, lh); }
        y += lh; y += .002 * u;
      }
    }
    if (d.bio) { gap(.03); para(d.bio, .03, 400, col.body, 1.75); }
    if (d.tags.length) {
      gap(.034);
      const px = .026 * u, padX = .024 * u, h = px * 2.1, g = .014 * u;
      ctx.font = font(700, px);
      const rows = [[]]; let rw = 0;
      for (const t of d.tags) {
        const w = Math.min(ctx.measureText(t).width + padX * 2, box.w);
        if (rows.at(-1).length && rw + g + w > box.w) { rows.push([]); rw = 0; }
        rw += (rows.at(-1).length ? g : 0) + w; rows.at(-1).push({ t, w });
      }
      rows.forEach((row, i) => {
        if (i) y += g;
        const total = row.reduce((a, c) => a + c.w, 0) + g * (row.length - 1);
        let x = center ? box.x + (box.w - total) / 2 : box.x;
        for (const c of row) {
          if (draw) {
            ctx.fillStyle = col.chipBg; rrect(x, y, c.w, h, h / 2); ctx.fill();
            ctx.fillStyle = col.chipText; ctx.textAlign = 'center';
            ctx.fillText(c.t, x + c.w / 2, y + h / 2, c.w - padX * 2);
            ctx.textAlign = center ? 'center' : 'left';
          }
          x += c.w + g;
        }
        y += h;
      });
    }
    if (d.contacts.length) { gap(.034); for (const c of d.contacts) para(c, .026, 400, col.muted, 1.6); }
    return y - box.y;
  }

  function fitText(d, box, col, fam) {
    let s = 1;
    while (s > .5 && textBlock(d, box, col, fam, s, false) > box.h) s -= .03;
    const h = textBlock(d, box, col, fam, s, false);
    const off = box.valign === 'center' ? Math.max(0, (box.h - h) / 2) : 0;
    textBlock(d, { ...box, y: box.y + off }, col, fam, s, true);
  }

  // ---------- テンプレート ----------
  function render() {
    const d = data();
    const [W, H] = SIZES[d.size];
    if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
    const land = W / H > 1.2;
    const u = Math.min(W, H);
    const c = state.color;
    const fam = FONTS[d.font];
    const onColorDark = luminance(c) < .45;
    ctx.clearRect(0, 0, W, H);

    let col = {
      name: '#1c2130', body: '#3d4352', muted: '#757b8a', accent: c,
      chipBg: mix(c, '#ffffff', .86), chipText: mix(c, '#000000', .35),
      placeholder: mix(c, '#ffffff', .7), placeholderIcon: 'rgba(255,255,255,.85)',
    };
    let photo, text;

    if (d.tpl === 'basic') {
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = c;
      if (land) {
        const pw = W * .38; ctx.fillRect(0, 0, pw, H);
        const dd = Math.min(pw * .68, H * .62);
        photo = { x: (pw - dd) / 2, y: (H - dd) / 2, w: dd, h: dd, shape: 'circle', ring: { w: u * .012, c: '#ffffff' } };
        text = { x: pw + W * .055, y: H * .09, w: W - pw - W * .1, h: H * .82, align: 'left', valign: 'center' };
      } else {
        const band = H * (d.size === 'story' ? .22 : .25);
        ctx.fillRect(0, 0, W, band);
        const dd = Math.min(W * .36, H * .26);
        photo = { x: (W - dd) / 2, y: band - dd * .6, w: dd, h: dd, shape: 'circle', ring: { w: u * .014, c: '#ffffff' } };
        const ty = photo.y + dd + u * .055;
        text = { x: W * .09, y: ty, w: W * .82, h: H - ty - u * .07, align: 'center', valign: d.size === 'story' ? 'center' : 'top' };
      }
    } else if (d.tpl === 'photo') {
      ctx.fillStyle = mix(c, '#ffffff', .94); ctx.fillRect(0, 0, W, H);
      col.placeholderIcon = 'rgba(255,255,255,.9)';
      if (land) {
        const pw = W * .44;
        photo = { x: 0, y: 0, w: pw, h: H, shape: 'rect' };
        ctx.fillStyle = c; ctx.fillRect(pw, 0, u * .014, H);
        text = { x: pw + W * .06, y: H * .09, w: W - pw - W * .11, h: H * .82, align: 'left', valign: 'center' };
      } else {
        const ph = H * (d.size === 'square' ? .44 : d.size === 'story' ? .5 : .48);
        photo = { x: 0, y: 0, w: W, h: ph, shape: 'rect' };
        ctx.fillStyle = c; ctx.fillRect(0, ph, W, u * .014);
        ctx.fillRect(0, H - u * .02, W, u * .02);
        const ty = ph + u * .07;
        text = { x: W * .08, y: ty, w: W * .84, h: H - ty - u * .08, align: 'left', valign: 'top' };
      }
    } else { // dark
      ctx.fillStyle = '#16181e'; ctx.fillRect(0, 0, W, H);
      const g = ctx.createRadialGradient(W * .9, H * .05, 0, W * .9, H * .05, Math.max(W, H) * .75);
      g.addColorStop(0, rgba(c, .45)); g.addColorStop(1, rgba(c, 0));
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      const light = mix(c, '#ffffff', onColorDark ? .45 : .1);
      col = {
        name: '#ffffff', body: '#c8ccd6', muted: '#8d93a1', accent: light,
        chipBg: rgba(c, .28), chipText: '#ffffff', placeholder: '#2a2e38', placeholderIcon: '#4a505e',
      };
      if (land) {
        const pw = W * .4;
        const dd = Math.min(pw * .7, H * .62);
        photo = { x: (pw - dd) / 2 + W * .02, y: (H - dd) / 2, w: dd, h: dd, shape: 'round', r: dd * .14, ring: { w: u * .008, c: light } };
        text = { x: pw + W * .04, y: H * .09, w: W - pw - W * .1, h: H * .82, align: 'left', valign: 'center' };
      } else {
        const dd = Math.min(W * .4, H * .28);
        photo = { x: (W - dd) / 2, y: H * .075, w: dd, h: dd, shape: 'round', r: dd * .14, ring: { w: u * .008, c: light } };
        const ty = photo.y + dd + u * .065;
        text = { x: W * .09, y: ty, w: W * .82, h: H - ty - u * .07, align: 'center', valign: d.size === 'story' ? 'center' : 'top' };
      }
    }

    drawPhoto(photo, col);
    text.u = u;
    fitText(d, text, col, fam);
    state.photoBox = photo;
    updateDownloadState(d);
  }

  let raf = 0;
  const schedule = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(render); };

  // ---------- 写真の読み込み ----------
  function loadFile(file) {
    if (!file || !file.type.startsWith('image/')) { showMsg('画像ファイル（JPEG・PNGなど）を選んでください。', 'err'); return; }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      if (state.imgUrl) URL.revokeObjectURL(state.imgUrl);
      state.img = img; state.imgUrl = url; state.zoom = 1; state.fx = 0; state.fy = 0;
      $('#zoom').value = 1;
      $('#thumb').style.backgroundImage = 'url("' + url + '")';
      $('#photoLabel').textContent = '写真を変更する';
      showMsg('');
      schedule();
    };
    img.onerror = () => { URL.revokeObjectURL(url); showMsg('この画像は読み込めませんでした。別の画像を選んでください（HEICは非対応の場合があります）。', 'err'); };
    img.src = url;
  }
  $('#photo').addEventListener('change', (e) => loadFile(e.target.files[0]));
  const drop = $('#drop');
  ['dragenter', 'dragover'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', (e) => loadFile(e.dataTransfer.files[0]));

  $('#zoom').addEventListener('input', (e) => { state.zoom = +e.target.value; schedule(); });
  $('#resetPhoto').addEventListener('click', () => { state.zoom = 1; state.fx = 0; state.fy = 0; $('#zoom').value = 1; schedule(); });

  // プレビュー上のドラッグで写真位置を調整
  let drag = null;
  canvas.addEventListener('pointerdown', (e) => {
    if (!state.img) return;
    drag = { x: e.clientX, y: e.clientY, fx: state.fx, fy: state.fy };
    canvas.setPointerCapture(e.pointerId); canvas.classList.add('dragging');
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!drag || !photoGeom) return;
    const k = canvas.width / canvas.getBoundingClientRect().width;
    const clamp = (v) => Math.max(-1, Math.min(1, v));
    if (photoGeom.mx > 0) state.fx = clamp(drag.fx + (e.clientX - drag.x) * k / photoGeom.mx);
    if (photoGeom.my > 0) state.fy = clamp(drag.fy + (e.clientY - drag.y) * k / photoGeom.my);
    schedule();
  });
  const endDrag = () => { drag = null; canvas.classList.remove('dragging'); };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  // ---------- カラー ----------
  const sw = $('#swatches');
  PRESETS.forEach((p) => {
    const b = document.createElement('button');
    b.type = 'button'; b.style.background = p; b.dataset.c = p; b.setAttribute('aria-label', 'テーマカラー ' + p);
    sw.insertBefore(b, $('#color'));
  });
  const setColor = (c) => {
    state.color = c; $('#color').value = c;
    sw.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.c === c)));
    schedule();
  };
  sw.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setColor(b.dataset.c); });
  $('#color').addEventListener('input', (e) => setColor(e.target.value));

  // ---------- 入力変更 ----------
  const bioCount = () => { $('#bioCount').textContent = $('#bio').value.length + ' / 300'; };
  $('#form').addEventListener('input', (e) => { if (e.target.id === 'bio') bioCount(); if (e.target.type !== 'file' && e.target.type !== 'color') schedule(); });
  $('#form').addEventListener('change', schedule);
  $('#form').addEventListener('submit', (e) => e.preventDefault());

  // クリア（確認は画面内で）
  const clearBtns = (confirming) => { $('#clearAll').hidden = confirming; $('#clearYes').hidden = !confirming; $('#clearNo').hidden = !confirming; };
  $('#clearAll').addEventListener('click', () => clearBtns(true));
  $('#clearNo').addEventListener('click', () => clearBtns(false));
  $('#clearYes').addEventListener('click', () => {
    ['name', 'kana', 'title', 'catch', 'bio', 'tags', 'contacts'].forEach((id) => { $('#' + id).value = ''; });
    if (state.imgUrl) URL.revokeObjectURL(state.imgUrl);
    Object.assign(state, { img: null, imgUrl: null, zoom: 1, fx: 0, fy: 0 });
    $('#photo').value = ''; $('#zoom').value = 1; $('#thumb').style.backgroundImage = '';
    $('#photoLabel').textContent = '写真を選ぶ';
    clearBtns(false); bioCount(); showMsg(''); schedule();
    $('#name').focus();
  });

  // ---------- ダウンロード ----------
  function showMsg(t, kind) { const m = $('#msg'); m.textContent = t; m.className = 'msg' + (kind ? ' ' + kind : ''); }
  function updateDownloadState(d) {
    $('#download').disabled = !d.name;
    if (!d.name) showMsg('名前を入力するとダウンロードできます。', 'err');
    else if ($('#msg').textContent === '名前を入力するとダウンロードできます。') showMsg('');
  }
  let downloadsApi; // undefined: 未確認 / null: 使えない
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('downloads').then((api) => { downloadsApi = api; }).catch(() => { downloadsApi = null; });
  }
  $('#download').addEventListener('click', () => {
    render();
    // 日本語のファイル名は環境によって無視されるため、日時で名前を付ける
    const t = new Date(), z = (n) => String(n).padStart(2, '0');
    const filename = 'profile_' + t.getFullYear() + z(t.getMonth() + 1) + z(t.getDate()) + '_' + z(t.getHours()) + z(t.getMinutes()) + z(t.getSeconds()) + '.png';
    canvas.toBlob(async (blob) => {
      if (!blob) { showMsg('画像を作れませんでした。もう一度お試しください。', 'err'); return; }
      if (downloadsApi) {
        try { await downloadsApi.save({ filename, data: blob }); showMsg('「' + filename + '」を保存しました。', 'ok'); }
        catch (err) { showMsg(err && err.code === 'declined' ? '保存をキャンセルしました。' : '保存できませんでした（' + (err && err.code || 'エラー') + '）。', 'err'); }
        return;
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      showMsg('「' + filename + '」をダウンロードしました。', 'ok');
    }, 'image/png');
  });

  // ---------- スマホ用タブ ----------
  const setTab = (t) => {
    document.body.dataset.tab = t;
    $('#tabEdit').setAttribute('aria-selected', String(t === 'edit'));
    $('#tabPreview').setAttribute('aria-selected', String(t === 'preview'));
    window.scrollTo(0, 0);
  };
  $('#tabEdit').addEventListener('click', () => setTab('edit'));
  $('#tabPreview').addEventListener('click', () => setTab('preview'));

  // ---------- 初期化：Webフォント読み込み後に描画し直す ----------
  if (!document.body.dataset.tab) document.body.dataset.tab = 'edit';
  setColor(PRESETS[0]);
  bioCount();
  render();
  if (document.fonts) {
    Promise.all(Object.values(FONTS).flatMap((f) => [400, 700, 900].map((w) => document.fonts.load(w + ' 40px ' + f, 'あA'))))
      .catch(() => {}).then(render);
    document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', schedule);
  }
})();
</script>
</body>
</html>
