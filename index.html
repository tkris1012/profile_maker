<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>メンバープロフィールメーカー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Noto+Serif+JP:wght@400;700;900&family=Zen+Maru+Gothic:wght@400;700;900&display=swap">
<style>
/* レイアウト: 左に入力フォーム、右にライブプレビュー（スマホはタブ切替） */
:root {
  --bg: #f3f4f7;
  --panel: #ffffff;
  --fg: #1d2230;
  --muted: #646b7d;
  --line: #dde0e8;
  --field: #f8f9fb;
  --accent: #2f55d4;
  --accent-fg: #ffffff;
  --danger: #c23b3b;
  --ok: #1f8a5a;
  --font-ui: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161c; --panel: #1d2029; --fg: #e8eaf0; --muted: #9aa1b2; --line: #2e3240;
    --field: #252935; --accent: #7d9bff; --accent-fg: #0e1430; --danger: #ff7a7a; --ok: #5fd39a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14161c; --panel: #1d2029; --fg: #e8eaf0; --muted: #9aa1b2; --line: #2e3240;
  --field: #252935; --accent: #7d9bff; --accent-fg: #0e1430; --danger: #ff7a7a; --ok: #5fd39a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
header.top { max-width: 1240px; margin: 0 auto 16px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
header.top h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
header.top p { margin: 0; color: var(--muted); font-size: 13px; }

.app { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 20px; align-items: start; }
.pane { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; min-width: 0; }
.preview-pane { position: sticky; top: max(16px, env(safe-area-inset-top, 0px)); display: grid; gap: 14px; }

.group { display: grid; gap: 12px; padding-bottom: 18px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
.group:last-child { border-bottom: 0; margin-bottom: 0; padding-bottom: 0; }
.group h2 { font-size: 12px; margin: 0; color: var(--muted); letter-spacing: .12em; font-weight: 700; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
label.f { display: grid; gap: 4px; font-size: 13px; font-weight: 700; min-width: 0; }
label.f small { font-weight: 400; color: var(--muted); }
input[type="text"], textarea, select {
  width: 100%; font: inherit; font-weight: 400; color: var(--fg); background: var(--field);
  border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px;
}
textarea { resize: vertical; min-height: 84px; }
input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible, .seg label:focus-within {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.count { float: right; font-size: 11px; color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }

.drop {
  display: flex; align-items: center; gap: 14px; padding: 14px; border: 1.5px dashed var(--line);
  border-radius: 10px; background: var(--field); cursor: pointer;
}
.drop.over { border-color: var(--accent); }
.drop .thumb { width: 64px; height: 64px; border-radius: 50%; background: var(--line) center/cover no-repeat; flex: none; }
.drop .txt { min-width: 0; font-size: 13px; }
.drop .txt b { display: block; }
.drop .txt span { color: var(--muted); font-size: 12px; }
.pfile { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.range { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
.range input { width: 100%; accent-color: var(--accent); }

.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label {
  padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer;
  font-size: 13px; background: var(--field); user-select: none;
}
.seg input:checked + span { color: var(--accent); font-weight: 700; }
.seg label:has(input:checked) { border-color: var(--accent); }

.swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.swatches button {
  width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--panel);
  box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0;
}
.swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--fg); }
.swatches input[type="color"] { width: 36px; height: 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); padding: 2px; cursor: pointer; }

.stage { display: grid; place-items: center; background: repeating-conic-gradient(var(--field) 0 25%, var(--bg) 0 50%) 0 0 / 20px 20px; border-radius: 10px; padding: 14px; min-height: 240px; }
#card { display: block; max-width: 100%; max-height: calc(100vh - 260px); width: auto; height: auto; border-radius: 4px; box-shadow: 0 6px 24px rgba(0,0,0,.18); touch-action: none; cursor: grab; }
#card.dragging { cursor: grabbing; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button.btn {
  font: inherit; font-weight: 700; border-radius: 10px; padding: 11px 18px; cursor: pointer;
  border: 1px solid var(--line); background: var(--field); color: var(--fg);
}
button.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); flex: 1 1 220px; font-size: 15px; }
button.btn:disabled { opacity: .5; cursor: not-allowed; }
button.btn.danger { color: var(--danger); }
.msg { font-size: 13px; min-height: 1.6em; margin: 0; }
.msg.err { color: var(--danger); }
.msg.ok { color: var(--ok); }

.row3 { display: grid; grid-template-columns: 0.6fr 1fr 1fr; gap: 12px; }
.check-row { display: grid; grid-template-columns: 4.5em 1fr; gap: 10px; align-items: center; font-size: 13px; font-weight: 700; }
.photo-block { display: grid; gap: 10px; }
.tabs { display: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (max-width: 860px) {
  body { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  .app { grid-template-columns: minmax(0, 1fr); }
  .preview-pane { position: static; }
  #card { max-height: calc(100vh - 300px); }
  body[data-tab="edit"] .preview-pane { display: none; }
  body[data-tab="preview"] .form-pane { display: none; }
  .tabs {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    background: var(--panel); border-top: 1px solid var(--line);
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  .tabs button { font: inherit; font-weight: 700; padding: 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--field); color: var(--fg); cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
}
@media (max-width: 420px) { .row2, .row3 { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: no-preference) { button, .seg label { transition: background-color .15s, border-color .15s; } }
</style>
</head>
<body data-tab="edit">

<header class="top">
  <h1>メンバープロフィールメーカー</h1>
  <p>入力内容と写真はこの画面の中だけで使い、どこにも保存・送信しません。</p>
</header>

<main class="app">
  <form class="pane form-pane" id="form" autocomplete="off">
    <section class="group">
      <h2>メンバー</h2>
      <div class="photo-block" data-photo="member">
        <label class="drop" for="photo-member">
          <span class="thumb"></span>
          <span class="txt"><b class="plabel">メンバー写真を選ぶ</b><span>タップして選択、またはここにドラッグ＆ドロップ</span></span>
        </label>
        <input type="file" id="photo-member" class="pfile" accept="image/*">
        <div class="range">
          <span>拡大</span>
          <input type="range" id="zoom-member" class="pzoom" min="1" max="3" step="0.01" value="1" aria-label="メンバー写真の拡大率">
          <button type="button" class="btn preset" style="padding:6px 12px">位置リセット</button>
        </div>
      </div>
      <label class="f"><span>名前 <small>（必須）</small></span><input type="text" id="name" maxlength="30" value="山田 花子"></label>
      <div class="row3">
        <label class="f">年齢<input type="text" id="age" inputmode="numeric" maxlength="3" value="42"></label>
        <label class="f">地域<input type="text" id="area" maxlength="30" value="埼玉県さいたま市"></label>
        <label class="f">職業<input type="text" id="job" maxlength="30" value="パート（事務）"></label>
      </div>
      <div class="row2">
        <label class="f">家族構成<input type="text" id="family" maxlength="50" value="夫・子ども2人（中学生・小学生）"></label>
        <label class="f">登録日<input type="date" id="date"></label>
      </div>
      <div class="check-row"><span>つなぎ</span>
        <div class="seg" aria-label="つなぎ">
          <label><input type="checkbox" name="tsunagi" value="宮" checked><span>宮</span></label>
          <label><input type="checkbox" name="tsunagi" value="吉"><span>吉</span></label>
          <label><input type="checkbox" name="tsunagi" value="佐"><span>佐</span></label>
          <label><input type="checkbox" name="tsunagi" value="矢"><span>矢</span></label>
        </div>
      </div>
      <div class="check-row"><span>PBS</span>
        <div class="seg" aria-label="PBS">
          <label><input type="checkbox" name="pbs" value="青P" checked><span>青P</span></label>
          <label><input type="checkbox" name="pbs" value="石P"><span>石P</span></label>
          <label><input type="checkbox" name="pbs" value="古P"><span>古P</span></label>
        </div>
      </div>
    </section>

    <section class="group">
      <h2>詳細</h2>
      <label class="f">ニーズ<textarea id="needs" rows="2" maxlength="200">家計の足しになる収入がほしい。子どもの教育費に備えたい。</textarea></label>
      <label class="f">性格<textarea id="character" rows="2" maxlength="200">明るく面倒見がよい。慎重派で、納得してから動くタイプ。</textarea></label>
      <label class="f">やる理由<textarea id="reason" rows="2" maxlength="200">子どもとの時間を大切にしながら、自分の力で収入をつくりたい。</textarea></label>
      <label class="f">その他<textarea id="other" rows="2" maxlength="200">平日の午前中が連絡しやすい。</textarea></label>
    </section>

    <section class="group">
      <h2>紹介</h2>
      <div class="photo-block" data-photo="intro">
        <label class="drop" for="photo-intro">
          <span class="thumb"></span>
          <span class="txt"><b class="plabel">紹介者写真を選ぶ</b><span>タップして選択、またはここにドラッグ＆ドロップ</span></span>
        </label>
        <input type="file" id="photo-intro" class="pfile" accept="image/*">
        <div class="range">
          <span>拡大</span>
          <input type="range" id="zoom-intro" class="pzoom" min="1" max="3" step="0.01" value="1" aria-label="紹介者写真の拡大率">
          <button type="button" class="btn preset" style="padding:6px 12px">位置リセット</button>
        </div>
      </div>
      <div class="row2">
        <label class="f">紹介者<input type="text" id="introducer" maxlength="30" value="佐藤 一郎"></label>
        <label class="f">グループ<input type="text" id="group" maxlength="30" value="Aグループ"></label>
      </div>
      <div class="row3">
        <label class="f">年齢<input type="text" id="introAge" inputmode="numeric" maxlength="3" value="55"></label>
        <label class="f">地域<input type="text" id="introArea" maxlength="30" value="東京都練馬区"></label>
        <label class="f">職業<input type="text" id="introJob" maxlength="30" value="自営業"></label>
      </div>
      <p class="hint">写真は拡大したあと、プレビュー上でドラッグすると位置を調整できます。</p>
    </section>

    <section class="group">
      <h2>デザイン</h2>
      <div class="seg" role="radiogroup" aria-label="テンプレート">
        <label><input type="radio" name="tpl" value="basic" checked><span>ベーシック</span></label>
        <label><input type="radio" name="tpl" value="soft"><span>ソフト</span></label>
        <label><input type="radio" name="tpl" value="dark"><span>ダーク</span></label>
      </div>
      <div class="seg" role="radiogroup" aria-label="画像サイズ">
        <label><input type="radio" name="size" value="portrait" checked><span>縦 4:5</span></label>
        <label><input type="radio" name="size" value="square"><span>正方形</span></label>
        <label><input type="radio" name="size" value="story"><span>ストーリー 9:16</span></label>
        <label><input type="radio" name="size" value="landscape"><span>横 16:9</span></label>
      </div>
      <div class="seg" role="radiogroup" aria-label="フォント">
        <label><input type="radio" name="font" value="sans" checked><span>ゴシック</span></label>
        <label><input type="radio" name="font" value="serif"><span>明朝</span></label>
        <label><input type="radio" name="font" value="maru"><span>丸ゴシック</span></label>
      </div>
      <div class="swatches" id="swatches" aria-label="テーマカラー">
        <input type="color" id="color" value="#2f6fed" aria-label="好きな色を選ぶ">
      </div>
    </section>

    <section class="group">
      <div class="actions">
        <button type="button" class="btn danger" id="clearAll">入力をすべてクリア</button>
        <button type="button" class="btn" id="clearYes" hidden>本当にクリアする</button>
        <button type="button" class="btn" id="clearNo" hidden>やめる</button>
      </div>
    </section>
  </form>

  <section class="pane preview-pane" aria-label="プレビュー">
    <div class="stage"><canvas id="card" width="1080" height="1350" aria-label="プロフィール画像のプレビュー"></canvas></div>
    <p class="hint">入力を変えるとすぐ反映されます。内容がよければ下のボタンで保存、違っていれば入力欄を直してください。</p>
    <div class="actions">
      <button type="button" class="btn primary" id="download">この内容で画像をダウンロード（PNG）</button>
    </div>
    <p class="msg" id="msg" role="status"></p>
  </section>
</main>

<nav class="tabs" role="tablist" aria-label="表示切替">
  <button type="button" role="tab" id="tabEdit" aria-selected="true">入力する</button>
  <button type="button" role="tab" id="tabPreview" aria-selected="false">プレビュー・保存</button>
</nav>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const canvas = $('#card');
  const ctx = canvas.getContext('2d');

  const SIZES = { portrait: [1080, 1350], square: [1080, 1080], story: [1080, 1920], landscape: [1600, 900] };
  const FONTS = {
    sans: '"Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif',
    serif: '"Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif',
    maru: '"Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif',
  };
  const PRESETS = ['#2f6fed', '#e2546b', '#f08a24', '#2a9d6f', '#7b5cd6', '#3a4256'];
  const TSUNAGI = ['宮', '吉', '佐', '矢'];
  const PBS = ['青P', '石P', '古P'];
  const TEXT_IDS = ['name', 'age', 'area', 'job', 'family', 'needs', 'character', 'reason', 'other', 'introducer', 'group', 'introAge', 'introArea', 'introJob'];

  const state = { color: PRESETS[0], photos: { member: newPhoto(), intro: newPhoto() } };
  function newPhoto() { return { img: null, url: null, zoom: 1, fx: 0, fy: 0 }; }
  let boxes = {}; // 直近描画時の写真枠（ドラッグ判定用）

  // ---------- 色 ----------
  const hexToRgb = (h) => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  const mix = (a, b, t) => { const x = hexToRgb(a), y = hexToRgb(b); return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
  const luminance = (h) => { const [r, g, b] = hexToRgb(h).map((v) => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }); return .2126 * r + .7152 * g + .0722 * b; };
  const onColor = (h) => luminance(h) > .5 ? '#1c2130' : '#ffffff';

  function palette(tpl, c) {
    const strong = luminance(c) > .45 ? mix(c, '#000000', .35) : c;
    if (tpl === 'dark') return {
      bg: '#16181e', panel: '#20232b', line: '#30343f', name: '#ffffff', body: '#c8ccd6', muted: '#8d93a1',
      accent: mix(c, '#ffffff', luminance(c) < .3 ? .4 : .1), chip: c, header: c,
      placeholder: '#2a2e38', placeholderIcon: '#4a505e', ring: '#16181e',
    };
    return {
      bg: tpl === 'soft' ? mix(c, '#ffffff', .93) : '#ffffff',
      panel: tpl === 'soft' ? '#ffffff' : mix(c, '#ffffff', .93),
      line: tpl === 'soft' ? mix(c, '#ffffff', .75) : '#e3e5ea',
      name: '#1c2130', body: '#3d4352', muted: '#737a8a', accent: strong, chip: c, header: c,
      placeholder: mix(c, '#ffffff', .72), placeholderIcon: 'rgba(255,255,255,.88)', ring: '#ffffff',
    };
  }

  // ---------- 入力 ----------
  const val = (id) => $('#' + id).value.trim();
  const radio = (name) => $('input[name="' + name + '"]:checked').value;
  const checks = (name) => [...document.querySelectorAll('input[name="' + name + '"]:checked')].map((i) => i.value);
  function data() {
    const d = {};
    TEXT_IDS.forEach((id) => { d[id] = val(id); });
    d.date = val('date');
    d.tsunagi = checks('tsunagi'); d.pbs = checks('pbs');
    d.tpl = radio('tpl'); d.size = radio('size'); d.font = radio('font');
    return d;
  }

  // ---------- 折り返し（日本語は1文字単位、英数字は単語単位、簡易禁則） ----------
  const NO_START = /^[、。，．,.・：:；;！!？?」』）)\]】〉》ーぁぃぅぇぉっゃゅょァィゥェォッャュョ〜]/;
  function wrap(text, maxW) {
    const out = [];
    for (const para of text.split('\n')) {
      const tokens = para.match(/[\x21-\x7E]+\s*|\s+|./gsu) || [''];
      let line = '';
      const fits = (s) => ctx.measureText(s.trimEnd()).width <= maxW;
      for (const t of tokens) {
        if (fits(line + t)) { line += t; continue; }
        if (line && NO_START.test(t)) { line += t; continue; }
        let carry = '';
        const m = line.trimEnd().match(/[「『（(【〈《]+$/u); // 開き括弧で行を終えない
        if (m && m[0].length < line.trimEnd().length) { carry = m[0]; line = line.trimEnd().slice(0, -carry.length); }
        if (line.trim()) out.push(line.trimEnd());
        line = carry;
        const tt = t.trimStart();
        if (fits(line + tt)) { line += tt; continue; }
        for (const ch of tt) {
          if (line && !fits(line + ch)) { out.push(line); line = ''; }
          line += ch;
        }
      }
      out.push(line.trimEnd());
    }
    return out;
  }

  function rrect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  // ---------- 写真（円形） ----------
  function drawPhoto(key, x, y, dd, col, ringW) {
    const p = state.photos[key];
    const b = { x, y, w: dd, h: dd };
    ctx.save();
    ctx.beginPath(); ctx.arc(x + dd / 2, y + dd / 2, dd / 2, 0, Math.PI * 2); ctx.clip();
    if (p.img) {
      const sc = Math.max(dd / p.img.naturalWidth, dd / p.img.naturalHeight) * p.zoom;
      const dw = p.img.naturalWidth * sc, dh = p.img.naturalHeight * sc;
      b.mx = (dw - dd) / 2; b.my = (dh - dd) / 2;
      ctx.drawImage(p.img, x - b.mx + p.fx * b.mx, y - b.my + p.fy * b.my, dw, dh);
    } else {
      ctx.fillStyle = col.placeholder; ctx.fillRect(x, y, dd, dd);
      ctx.fillStyle = col.placeholderIcon;
      ctx.beginPath(); ctx.arc(x + dd / 2, y + dd * .42, dd * .18, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x + dd / 2, y + dd * .92, dd * .34, dd * .3, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    if (ringW) { ctx.beginPath(); ctx.arc(x + dd / 2, y + dd / 2, dd / 2, 0, Math.PI * 2); ctx.lineWidth = ringW; ctx.strokeStyle = col.ring; ctx.stroke(); }
    boxes[key] = b;
  }

  // ---------- レイアウト部品（draw=false なら高さだけ返す） ----------
  function makeL(draw, s, u, fam, col) {
    const U = u * s;
    const font = (w, px) => w + ' ' + px + 'px ' + fam;
    const text = (x, y, w, str, size, weight, color, lh = 1.5, align = 'left', spacing = 0) => {
      if (!str) return 0;
      const px = size * U;
      ctx.font = font(weight, px);
      if ('letterSpacing' in ctx) ctx.letterSpacing = spacing ? px * spacing + 'px' : '0px';
      ctx.textAlign = align; ctx.textBaseline = 'middle';
      const lines = wrap(str, w);
      if (draw) {
        ctx.fillStyle = color;
        lines.forEach((ln, i) => ctx.fillText(ln, align === 'center' ? x + w / 2 : align === 'right' ? x + w : x, y + px * lh * (i + .5)));
      }
      if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
      return lines.length * px * lh;
    };
    return { draw, s, u, U, fam, col, font, text };
  }

  // 年齢・地域・職業・家族構成
  const fmtAge = (a) => a ? a + (/^\d+$/.test(a) ? '歳' : '') : '';

  // 見出し＋値の格子（空の値は省く）
  function kvGrid(L, x, y, w, cols, items, align = 'left', vsize = .031) {
    items = items.filter(([, v]) => v);
    const g = .03 * L.U, rg = .022 * L.U;
    const cw = (w - g * (cols - 1)) / cols;
    let h = 0;
    for (let i = 0; i < items.length; i += cols) {
      let rh = 0;
      items.slice(i, i + cols).forEach(([k, v], j) => {
        const cx = x + j * (cw + g);
        let ch = L.text(cx, y + h, cw, k, .022, 700, L.col.muted, 1.5, align, .08);
        ch += L.text(cx, y + h + ch, cw, v, vsize, 700, L.col.name, 1.4, align);
        rh = Math.max(rh, ch);
      });
      h += rh + rg;
    }
    return items.length ? h - rg : 0;
  }

  // 年齢・地域・職業・家族構成
  const infoGrid = (L, x, y, w, cols, d, align) =>
    kvGrid(L, x, y, w, cols, [['年齢', fmtAge(d.age)], ['地域', d.area], ['職業', d.job], ['家族構成', d.family]], align);

  // ニーズ・性格・やる理由・その他
  function sections(L, x, y, w, d) {
    const items = [['ニーズ', d.needs], ['性格', d.character], ['やる理由', d.reason], ['その他', d.other]].filter(([, v]) => v);
    let h = 0;
    items.forEach(([k, v], i) => {
      if (i) h += .03 * L.U;
      const px = .026 * L.U;
      if (L.draw) { ctx.fillStyle = L.col.accent; ctx.fillRect(x, y + h + px * .2, px * .28, px * 1.1); }
      h += L.text(x + px * .7, y + h, w - px * .7, k, .026, 700, L.col.accent, 1.5, 'left', .06);
      h += .006 * L.U;
      h += L.text(x, y + h, w, v, .03, 400, L.col.body, 1.65);
    });
    return h;
  }

  // チェック項目（全選択肢を表示し、チェック済みを塗りつぶす）
  function chipRow(L, x, y, w, label, opts, on) {
    const U = L.U, px = .026 * U, h = .058 * U, padX = .022 * U, g = .012 * U, lw = .14 * U;
    L.text(x, y + (h - px * 1.4) / 2, lw, label, .026, 700, L.col.muted, 1.4);
    ctx.font = L.font(700, px);
    let cx = x + lw, cy = y;
    for (const o of opts) {
      const box = px * .8;
      const cw = padX * 2 + box + px * .35 + ctx.measureText(o).width;
      if (cx > x + lw && cx + cw > x + w) { cx = x + lw; cy += h + g; }
      if (L.draw) {
        const checked = on.includes(o);
        const fg = checked ? onColor(L.col.chip) : L.col.muted;
        rrect(cx, cy, cw, h, h / 2);
        if (checked) { ctx.fillStyle = L.col.chip; ctx.fill(); }
        else { ctx.lineWidth = Math.max(2, .003 * U); ctx.strokeStyle = L.col.line; ctx.stroke(); }
        const bx = cx + padX, by = cy + (h - box) / 2;
        ctx.lineWidth = Math.max(2, .0035 * U); ctx.strokeStyle = fg;
        rrect(bx, by, box, box, box * .2); ctx.stroke();
        if (checked) {
          ctx.beginPath(); ctx.moveTo(bx + box * .2, by + box * .52); ctx.lineTo(bx + box * .42, by + box * .74); ctx.lineTo(bx + box * .82, by + box * .28);
          ctx.lineWidth = Math.max(2.5, .005 * U); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
        }
        ctx.font = L.font(700, px); ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = fg;
        ctx.fillText(o, bx + box + px * .35, cy + h / 2);
      }
      cx += cw + g;
    }
    return cy + h - y;
  }

  // メンバーのつなぎ・PBS
  function memberChecks(L, x, y, w, d) {
    let h = chipRow(L, x, y, w, 'つなぎ', TSUNAGI, d.tsunagi);
    h += .016 * L.U;
    return h + chipRow(L, x, y + h, w, 'PBS', PBS, d.pbs);
  }

  // 紹介者の情報（背景つきパネル）
  function introPanel(L, x, y, w, d) {
    const inner = (M, draw) => {
      const U = M.U, p = .035 * U, dd = .14 * U;
      const tx = x + p + dd + .035 * U, tw = w - p * 2 - dd - .035 * U;
      const block = (B, ty) => {
        let h = kvGrid(B, tx, ty, tw, 2, [['紹介者', d.introducer || '—'], ['グループ', d.group || '—']], 'left', .032);
        const sub = [['年齢', fmtAge(d.introAge)], ['地域', d.introArea], ['職業', d.introJob]];
        if (sub.some(([, v]) => v)) h += .022 * U + kvGrid(B, tx, ty + h + .022 * U, tw, 3, sub, 'left', .028);
        return h;
      };
      const th = block(makeL(false, M.s, M.u, M.fam, M.col), 0);
      if (draw) {
        drawPhoto('intro', x + p, y + p + Math.max(0, (th - dd) / 2), dd, M.col, 0);
        block(M, y + p + Math.max(0, (dd - th) / 2));
      }
      return p * 2 + Math.max(dd, th);
    };
    const ghost = { ...L, draw: false, text: makeL(false, L.s, L.u, L.fam, L.col).text };
    const h = inner(ghost, false);
    if (L.draw) {
      ctx.fillStyle = L.col.panel; rrect(x, y, w, h, .03 * L.U); ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = L.col.line; ctx.stroke();
      inner(L, true);
    }
    return h;
  }

  // ---------- 全体 ----------
  function layout(L, W, H, d, top, bottom) {
    const U = L.U, pad = .065 * L.u;
    if (W / H > 1.2) { // 横長: 左にメンバー、右に詳細と紹介
      const lw = W * .32, rx = pad + lw + W * .045, rw = W - pad - rx;
      const dd = Math.min(.36 * U, lw * .8);
      let ly = top;
      if (L.draw) drawPhoto('member', pad + (lw - dd) / 2, ly, dd, L.col, .012 * U);
      ly += dd + .03 * U;
      ly += L.text(pad, ly, lw, d.name, .066, 900, L.col.name, 1.25, 'center');
      ly += .025 * U;
      ly += infoGrid(L, pad, ly, lw, 2, d, 'center');
      ly += .04 * U;
      ly += memberChecks(L, pad, ly, lw, d);
      if (L.draw) { ctx.fillStyle = L.col.line; ctx.fillRect(pad + lw + W * .0225, top, 2, bottom - top); }
      const secH = sections(L, rx, top, rw, d);
      const ip = introPanel({ ...L, draw: false, text: makeL(false, L.s, L.u, L.fam, L.col).text }, rx, 0, rw, d);
      const iy = Math.max(top + secH + .04 * U, bottom - ip);
      if (L.draw) introPanel(L, rx, iy, rw, d);
      return Math.max(ly, top + secH + (secH ? .04 * U : 0) + ip) - top;
    }
    // 縦長・正方形: 上からメンバー → 詳細 → 紹介パネル（下寄せ）
    const w = W - pad * 2;
    const dd = .3 * U;
    const tx = pad + dd + .05 * U, tw = W - pad - tx;
    const ghost = makeL(false, L.s, L.u, L.fam, L.col);
    const nameH = ghost.text(tx, 0, tw, d.name, .072, 900, L.col.name, 1.25);
    const infoH = infoGrid(ghost, tx, 0, tw, 2, d);
    const rightH = nameH + (infoH ? .025 * U + infoH : 0);
    const heroH = Math.max(dd, rightH);
    if (L.draw) {
      drawPhoto('member', pad, top + (heroH - dd) / 2, dd, L.col, .012 * U);
      const ry = top + (heroH - rightH) / 2;
      L.text(tx, ry, tw, d.name, .072, 900, L.col.name, 1.25);
      infoGrid(L, tx, ry + nameH + .025 * U, tw, 2, d);
    }
    let y = top + heroH + .04 * U;
    y += memberChecks(L, pad, y, w, d);
    const secH = sections(ghost, pad, 0, w, d);
    if (secH) {
      y += .04 * U;
      if (L.draw) { ctx.fillStyle = L.col.line; ctx.fillRect(pad, y, w, 2); }
      y += .04 * U;
      sections(L, pad, y, w, d);
      y += secH;
    }
    const ip = introPanel({ ...L, draw: false, text: ghost.text }, pad, 0, w, d);
    if (L.draw) introPanel(L, pad, y + .045 * U, w, d);
    return y + .045 * U + ip - top;
  }

  function render() {
    const d = data();
    const [W, H] = SIZES[d.size];
    if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
    const u = Math.min(W, H), pad = .065 * u;
    const col = palette(d.tpl, state.color);
    const fam = FONTS[d.font];
    boxes = {};
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = col.bg; ctx.fillRect(0, 0, W, H);

    // ヘッダー帯
    const hh = .1 * u, fg = onColor(col.header);
    ctx.fillStyle = col.header; ctx.fillRect(0, 0, W, hh);
    const HL = makeL(true, 1, u, fam, col);
    HL.text(pad, hh / 2 - .021 * u, W / 2, 'MEMBER PROFILE', .028, 900, fg, 1.5, 'left', .2);
    if (d.date) {
      const [yy, mm, dd] = d.date.split('-');
      ctx.globalAlpha = .85;
      HL.text(W / 2, hh / 2 - .021 * u, W / 2 - pad, '登録日  ' + yy + '.' + mm + '.' + dd, .028, 700, fg, 1.5, 'right');
      ctx.globalAlpha = 1;
    }

    const top = hh + pad * .75, bottom = H - pad * .9;
    // 収まる最大の文字倍率を探し、余白は上下に均等配分
    let s = 1.2, need;
    while ((need = layout(makeL(false, s, u, fam, col), W, H, d, top, bottom)) > bottom - top && s > .5) s -= .03;
    const off = W / H > 1.2 ? 0 : Math.max(0, (bottom - top - need) / 2);
    layout(makeL(true, s, u, fam, col), W, H, d, top + off, bottom);
    updateDownloadState(d);
  }

  let raf = 0;
  const schedule = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(render); };

  // ---------- 写真入力（メンバー・紹介者） ----------
  document.querySelectorAll('.photo-block').forEach((blk) => {
    const key = blk.dataset.photo;
    const p = state.photos[key];
    const thumb = $('.thumb', blk), label = $('.plabel', blk), drop = $('.drop', blk), zoom = $('.pzoom', blk);
    const baseLabel = label.textContent;
    const load = (file) => {
      if (!file || !file.type.startsWith('image/')) { showMsg('画像ファイル（JPEG・PNGなど）を選んでください。', 'err'); return; }
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        if (p.url) URL.revokeObjectURL(p.url);
        Object.assign(p, { img, url, zoom: 1, fx: 0, fy: 0 });
        zoom.value = 1;
        thumb.style.backgroundImage = 'url("' + url + '")';
        label.textContent = baseLabel.replace('を選ぶ', 'を変更する');
        showMsg(''); schedule();
      };
      img.onerror = () => { URL.revokeObjectURL(url); showMsg('この画像は読み込めませんでした。別の画像を選んでください（HEICは非対応の場合があります）。', 'err'); };
      img.src = url;
    };
    $('.pfile', blk).addEventListener('change', (e) => load(e.target.files[0]));
    ['dragenter', 'dragover'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', (e) => load(e.dataTransfer.files[0]));
    zoom.addEventListener('input', () => { p.zoom = +zoom.value; schedule(); });
    $('.preset', blk).addEventListener('click', () => { Object.assign(p, { zoom: 1, fx: 0, fy: 0 }); zoom.value = 1; schedule(); });
    blk.reset = () => {
      if (p.url) URL.revokeObjectURL(p.url);
      Object.assign(p, newPhoto());
      $('.pfile', blk).value = ''; zoom.value = 1; thumb.style.backgroundImage = ''; label.textContent = baseLabel;
    };
  });

  // プレビュー上のドラッグで写真位置を調整（押した位置の写真を動かす）
  let drag = null;
  const toCanvas = (e) => { const r = canvas.getBoundingClientRect(), k = canvas.width / r.width; return [(e.clientX - r.left) * k, (e.clientY - r.top) * k, k]; };
  canvas.addEventListener('pointerdown', (e) => {
    const [cx, cy] = toCanvas(e);
    const key = Object.keys(boxes).find((k) => { const b = boxes[k]; return state.photos[k].img && cx >= b.x && cx <= b.x + b.w && cy >= b.y && cy <= b.y + b.h; });
    if (!key) return;
    const p = state.photos[key];
    drag = { key, x: e.clientX, y: e.clientY, fx: p.fx, fy: p.fy };
    canvas.setPointerCapture(e.pointerId); canvas.classList.add('dragging');
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const b = boxes[drag.key], p = state.photos[drag.key];
    if (!b) return;
    const k = toCanvas(e)[2];
    const clamp = (v) => Math.max(-1, Math.min(1, v));
    if (b.mx > 0) p.fx = clamp(drag.fx + (e.clientX - drag.x) * k / b.mx);
    if (b.my > 0) p.fy = clamp(drag.fy + (e.clientY - drag.y) * k / b.my);
    schedule();
  });
  const endDrag = () => { drag = null; canvas.classList.remove('dragging'); };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  // ---------- カラー ----------
  const sw = $('#swatches');
  PRESETS.forEach((c) => {
    const b = document.createElement('button');
    b.type = 'button'; b.style.background = c; b.dataset.c = c; b.setAttribute('aria-label', 'テーマカラー ' + c);
    sw.insertBefore(b, $('#color'));
  });
  const setColor = (c) => {
    state.color = c; $('#color').value = c;
    sw.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.c === c)));
    schedule();
  };
  sw.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setColor(b.dataset.c); });
  $('#color').addEventListener('input', (e) => setColor(e.target.value));

  // ---------- 入力変更 ----------
  $('#form').addEventListener('input', (e) => { if (e.target.type !== 'file' && e.target.type !== 'color') schedule(); });
  $('#form').addEventListener('change', schedule);
  $('#form').addEventListener('submit', (e) => e.preventDefault());

  const today = () => { const t = new Date(), z = (n) => String(n).padStart(2, '0'); return t.getFullYear() + '-' + z(t.getMonth() + 1) + '-' + z(t.getDate()); };
  $('#date').value = today();

  // クリア（確認は画面内で）
  const clearBtns = (confirming) => { $('#clearAll').hidden = confirming; $('#clearYes').hidden = !confirming; $('#clearNo').hidden = !confirming; };
  $('#clearAll').addEventListener('click', () => clearBtns(true));
  $('#clearNo').addEventListener('click', () => clearBtns(false));
  $('#clearYes').addEventListener('click', () => {
    TEXT_IDS.forEach((id) => { $('#' + id).value = ''; });
    $('#date').value = today();
    document.querySelectorAll('input[type="checkbox"]').forEach((c) => { c.checked = false; });
    document.querySelectorAll('.photo-block').forEach((blk) => blk.reset());
    clearBtns(false); showMsg(''); schedule();
    $('#name').focus();
  });

  // ---------- ダウンロード ----------
  function showMsg(t, kind) { const m = $('#msg'); m.textContent = t; m.className = 'msg' + (kind ? ' ' + kind : ''); }
  const NEED_NAME = '名前を入力するとダウンロードできます。';
  function updateDownloadState(d) {
    $('#download').disabled = !d.name;
    if (!d.name) showMsg(NEED_NAME, 'err');
    else if ($('#msg').textContent === NEED_NAME) showMsg('');
  }
  let downloadsApi = null;
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('downloads').then((api) => { downloadsApi = api; }).catch(() => {});
  }
  $('#download').addEventListener('click', () => {
    render();
    // 日本語のファイル名は環境によって無視されるため、日時で名前を付ける
    const t = new Date(), z = (n) => String(n).padStart(2, '0');
    const filename = 'profile_' + t.getFullYear() + z(t.getMonth() + 1) + z(t.getDate()) + '_' + z(t.getHours()) + z(t.getMinutes()) + z(t.getSeconds()) + '.png';
    canvas.toBlob(async (blob) => {
      if (!blob) { showMsg('画像を作れませんでした。もう一度お試しください。', 'err'); return; }
      if (downloadsApi) {
        try { await downloadsApi.save({ filename, data: blob }); showMsg('「' + filename + '」を保存しました。', 'ok'); }
        catch (err) { showMsg(err && err.code === 'declined' ? '保存をキャンセルしました。' : '保存できませんでした（' + (err && err.code || 'エラー') + '）。', 'err'); }
        return;
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      showMsg('「' + filename + '」をダウンロードしました。', 'ok');
    }, 'image/png');
  });

  // ---------- スマホ用タブ ----------
  const setTab = (t) => {
    document.body.dataset.tab = t;
    $('#tabEdit').setAttribute('aria-selected', String(t === 'edit'));
    $('#tabPreview').setAttribute('aria-selected', String(t === 'preview'));
    window.scrollTo(0, 0);
  };
  $('#tabEdit').addEventListener('click', () => setTab('edit'));
  $('#tabPreview').addEventListener('click', () => setTab('preview'));

  // ---------- 初期化：Webフォント読み込み後に描画し直す ----------
  if (!document.body.dataset.tab) document.body.dataset.tab = 'edit';
  setColor(PRESETS[0]);
  render();
  if (document.fonts) {
    Promise.all(Object.values(FONTS).flatMap((f) => [400, 700, 900].map((w) => document.fonts.load(w + ' 40px ' + f, 'あA'))))
      .catch(() => {}).then(render);
    if (document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', schedule);
  }
})();
</script>
</body>
</html>
